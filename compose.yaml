services:
  mysql:
    image: mysql:latest
    container_name: MS-plantilla # Nombre del contenedor
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-bd_plantilla}
      MYSQL_USER: ${DB_USER:-user_dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev_password}
      
    ports:
      - "3321:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: MS-plantilla_gui # Nombre del contenedor
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '9021:80' # 8080 es usado por springboot

volumes:
  db_data: